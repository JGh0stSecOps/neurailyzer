name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,mcp]"
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy (types)
        run: mypy

  test:
    # full OS matrix: the wipers touch the filesystem, so every platform's
    # quirks (read-only attrs, symlink privileges, path separators) run for real
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,mcp]"
      - name: pytest (unit + e2e smoke)
        run: pytest

  test-required:
    # Preserve the required check names after expanding test to an OS matrix.
    # Both gates cover the entire matrix, including Python 3.13; a failed,
    # cancelled, or skipped dependency must never turn into a passing gate.
    name: test (${{ matrix.python }})
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: require the complete test matrix
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Test matrix did not succeed (result: $MATRIX_RESULT)"
            exit 1
          fi
          echo "All matrix jobs passed."
