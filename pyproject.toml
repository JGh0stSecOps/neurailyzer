[project]
name = "neurailyzer"
version = "0.1.0"
description = "State hygiene for AI agents — distill what matters, wipe the drift, restore to a point in time."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Zoetic Solutions" }]
keywords = ["ai", "agents", "memory", "context", "mcp", "hygiene", "wipe"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
neurailyzer = "neurailyzer.cli:app"

[project.urls]
Homepage = "https://github.com/ZoeticSolutions/neurailyzer"
Design = "https://github.com/ZoeticSolutions/neurailyzer/blob/main/docs/DESIGN.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurailyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# B008: typer's Argument()/Option() call-in-default is the idiom, not a bug.
# S603/S607 (subprocess) are expected in wipers; justify per-call with # noqa when added.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
addopts = "-q --cov=neurailyzer --cov-report=term-missing"
testpaths = ["tests"]
