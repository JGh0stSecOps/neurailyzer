[project]
name = "neurailyzer"
version = "0.1.0"
description = "State hygiene for AI agents — distill what matters, wipe the drift, restore to a point in time."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Zoetic Solutions" }]
keywords = ["ai", "agents", "memory", "context", "mcp", "hygiene", "wipe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Typing :: Typed",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
neurailyzer = "neurailyzer.cli:app"

[project.urls]
Homepage = "https://github.com/JGh0stSecOps/neurailyzer"
Design = "https://github.com/JGh0stSecOps/neurailyzer/blob/main/docs/DESIGN.md"
Issues = "https://github.com/JGh0stSecOps/neurailyzer/issues"
Changelog = "https://github.com/JGh0stSecOps/neurailyzer/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurailyzer"]
# ship the inline type information (the package is mypy --strict clean)
artifacts = ["src/neurailyzer/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# B008: typer's Argument()/Option() call-in-default is the idiom, not a bug.
# S603/S607 (subprocess) are expected in wipers; justify per-call with # noqa when added.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
addopts = "-q --cov=neurailyzer --cov-report=term-missing"
testpaths = ["tests"]
markers = ["e2e: end-to-end smoke tests that drive the real CLI as a subprocess"]
