<svg xmlns="http://www.w3.org/2000/svg" width="520" height="152" viewBox="0 0 520 152" role="img" aria-label="NeurAIlyzer">
  <defs>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="76" x2="0" y2="118">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.42" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#64748b"/>
      <stop offset="0.58" stop-color="#aab6c4"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="45%" stop-color="#fb5252"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="fg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="26%" stop-color="#ffe4e4"/>
      <stop offset="62%" stop-color="#ef4444" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <linearGradient id="lens" x1="0.12" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#47596e"/>
      <stop offset="0.45" stop-color="#303d4e"/>
      <stop offset="1" stop-color="#25303e"/>
    </linearGradient>
    <linearGradient id="browmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b96a4"/>
      <stop offset="0.5" stop-color="#59626f"/>
      <stop offset="1" stop-color="#3f4753"/>
    </linearGradient>
    <clipPath id="lensclip"><path d="M-49,-12 Q-49,-14.5 -45,-14.5 L-6,-14.5 Q-5,-16.2 -3.5,-16.2 L3.5,-16.2 Q5,-16.2 6,-14.5 L45,-14.5 Q49,-14.5 49,-12 L51,-6 Q51,0.5 46,6.5 Q37,12.5 22,14.8 L12,15.2 Q9.5,15.3 8.5,13 Q6,8.5 3.5,6.6 Q1.8,5.3 0,5.3 Q-1.8,5.3 -3.5,6.6 Q-6,8.5 -8.5,13 Q-9.5,15.3 -12,15.2 L-22,14.8 Q-37,12.5 -46,6.5 Q-51,0.5 -51,-6 Z"/></clipPath>
    <linearGradient id="sweepgrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.78"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .base { fill: #e8edf3; }
    text  { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1.5px; }
    #burst { transform-box: fill-box; transform-origin: center; animation: burst 4.4s ease-out infinite; }
    .redlight { animation: breathe 4.4s ease-in-out infinite; }
    .redflash { opacity: 0; animation: whiteflash 4.4s ease-out infinite; }
    @keyframes burst { 0%,84%,100% { opacity:0; transform:scale(.15); } 88% { opacity:1; transform:scale(1); } 89% { opacity:.9; transform:scale(1.12); } 96% { opacity:0; transform:scale(2); } }
    @keyframes breathe { 0%,100% { opacity:.85; } 45% { opacity:.55; } }
    @keyframes whiteflash { 0%,84%,100% { opacity:0; } 88%,89% { opacity:1; } 93% { opacity:0; } }
    .sweep { animation: sweep 4.4s linear infinite; }
    @keyframes sweep { 0%,83% { opacity:0; transform:translateX(70px); } 86% { opacity:1; } 88% { transform:translateX(0px); } 91% { opacity:1; } 94% { opacity:0; transform:translateX(-70px); } 100% { opacity:0; transform:translateX(-70px); } }
  </style>

  <!-- wordmark; A + the device share one chrome gradient, bright on dark so no keyline is needed. -->
  <text x="260" y="118" font-size="60" text-anchor="middle"><tspan class="base">Neur</tspan><tspan fill="url(#metal)">A</tspan><tspan class="base" dx="16">lyzer</tspan></text>
  <!-- trademark, placed absolutely so the wordmark's centered spacing is untouched -->
  <text x="415" y="84" font-size="19" font-weight="600" class="base" opacity="0.9">™</text>

  <!-- the "I" = a neuralyzer, sized/placed like a capital I (cap-top to baseline) -->
  <g transform="translate(278,0)">
    <ellipse class="redlight" cx="0" cy="83" rx="8" ry="6" fill="#ef4444" filter="url(#soft)"/>
    <rect x="-7" y="78" width="14" height="40" rx="2.5" fill="url(#metal)"/>
    <path d="M-5.5 76 a5.5 3 0 0 1 11 0 v2 h-11 z" fill="url(#metal)"/>
    <rect x="-7" y="105" width="14" height="1.1" fill="#00000055"/>
    <rect class="redlight" x="-7" y="80" width="14" height="6" rx="1.2" fill="url(#red)"/>
    <rect class="redflash" x="-7" y="80" width="14" height="6" rx="1.2" fill="#ffffff"/>
    <circle id="burst" cx="0" cy="78" r="22" fill="url(#fg)"/>
  </g>

  <!-- Sutro Lite-style shades over "eur": single semi-rimless shield, blacked-out lens, nose-bridge notch -->
  <g transform="translate(192,68) scale(0.72)">
    <path d="M-49,-12 Q-49,-14.5 -45,-14.5 L-6,-14.5 Q-5,-16.2 -3.5,-16.2 L3.5,-16.2 Q5,-16.2 6,-14.5 L45,-14.5 Q49,-14.5 49,-12 L51,-6 Q51,0.5 46,6.5 Q37,12.5 22,14.8 L12,15.2 Q9.5,15.3 8.5,13 Q6,8.5 3.5,6.6 Q1.8,5.3 0,5.3 Q-1.8,5.3 -3.5,6.6 Q-6,8.5 -8.5,13 Q-9.5,15.3 -12,15.2 L-22,14.8 Q-37,12.5 -46,6.5 Q-51,0.5 -51,-6 Z" fill="url(#lens)"/>
    <path d="M-49,-12 Q-49,-14.5 -45,-14.5 L-6,-14.5 Q-5,-16.2 -3.5,-16.2 L3.5,-16.2 Q5,-16.2 6,-14.5 L45,-14.5 Q49,-14.5 49,-12 L48,-5.5 Q45,-7 39,-7 L-39,-7 Q-45,-7 -48,-5.5 Z" fill="url(#browmetal)"/>
    <path d="M-40,-13.5 L40,-13.5 L39,-11.8 L-39,-11.8 Z" fill="#c4ccd6" opacity="0.5"/>
    <ellipse cx="-3.8" cy="8.4" rx="1.7" ry="2.6" fill="#626d7b"/>
    <ellipse cx="3.8" cy="8.4" rx="1.7" ry="2.6" fill="#626d7b"/>
    <g clip-path="url(#lensclip)"><g class="sweep"><rect x="-9" y="-32" width="18" height="64" transform="rotate(-18)" fill="url(#sweepgrad)"/></g></g>
  </g>
</svg>
